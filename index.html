<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindMe · Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #0b1120;
            color: #e2e8f0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated gradient blobs in background */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #6366f1, #8b5cf6);
            top: -150px;
            left: -100px;
            animation: floatBlob 14s ease-in-out infinite;
        }

        body::after {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #06b6d4, #3b82f6);
            bottom: -200px;
            right: -150px;
            animation: floatBlob 18s ease-in-out infinite reverse;
        }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -30px) scale(1.08); }
            66% { transform: translate(-30px, 25px) scale(0.95); }
        }

        /* Main card */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 4rem 3rem 3.5rem;
            text-align: center;
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            animation: cardIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 1rem;
            border-radius: 100px;
            margin-bottom: 1.8rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: #22d3ee;
            border-radius: 50%;
            box-shadow: 0 0 8px #22d3ee;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Headline */
        h1 {
            font-size: clamp(2rem, 5.5vw, 3.6rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 1.2rem;
            color: #f8fafc;
        }

        h1 .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.15rem;
            font-weight: 400;
            color: #94a3b8;
            max-width: 520px;
            margin: 0 auto 2.8rem;
        }

        /* Button */
        .getStarted {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #3b82f6 100%);
            background-size: 200% 200%;
            border: none;
            padding: 1.1rem 2.8rem;
            border-radius: 100px;
            cursor: pointer;
            letter-spacing: -0.01em;
            box-shadow: 
                0 10px 30px -8px rgba(99, 102, 241, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            overflow: hidden;
            isolation: isolate;
        }

        .getStarted::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #6366f1 100%);
            background-size: 200% 200%;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .getStarted:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 20px 40px -10px rgba(99, 102, 241, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.15) inset;
        }

        .getStarted:hover::before {
            opacity: 1;
            animation: gradientShift 2s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .getStarted:active {
            transform: translateY(-1px) scale(0.99);
        }

        .getStarted:focus-visible {
            outline: 3px solid #818cf8;
            outline-offset: 4px;
        }

        .getStarted .arrow {
            display: inline-block;
            font-size: 1.3rem;
            transition: transform 0.3s ease;
            line-height: 1;
        }

        .getStarted:hover .arrow {
            transform: translateX(5px);
        }

        /* Feature pills */
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 3rem;
            padding-top: 2.2rem;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }

        .feature {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #94a3b8;
            background: rgba(30, 41, 59, 0.5);
            padding: 0.55rem 1.1rem;
            border-radius: 100px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.25s ease;
        }

        .feature:hover {
            color: #e2e8f0;
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }

        .feature-icon {
            font-size: 1.1rem;
        }

        /* responsive */
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .container {
                padding: 2.8rem 1.5rem 2.5rem;
                border-radius: 2rem;
            }
            .tagline {
                font-size: 1rem;
                margin-bottom: 2.2rem;
            }
            .getStarted {
                font-size: 1rem;
                padding: 1rem 2.2rem;
            }
            .features {
                gap: 0.6rem;
                margin-top: 2.2rem;
                padding-top: 1.8rem;
            }
            .feature {
                font-size: 0.8rem;
                padding: 0.45rem 0.9rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Hidden nav preserved */
        nav { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Badge -->
        <div class="badge">
            <span class="badge-dot"></span>
            Lost & Found
        </div>

        <!-- Main headline with gradient accent -->
        <h1>
            Find what's <span class="gradient-text">lost</span>.<br>
            Return what's <span class="gradient-text">found</span>.
        </h1>

        <!-- Tagline -->
        <p class="tagline">
            FindMe helps you reconnect with your belongings in seconds — simple, fast, and secure.
        </p>

        <!-- CTA Button -->
        <button class="getStarted">
            Get Started
            <span class="arrow">→</span>
        </button>

        <!-- Feature highlights -->
        <div class="features">
            <div class="feature">
                <span class="feature-icon">📍</span>
                Report Items
            </div>
            <div class="feature">
                <span class="feature-icon">🔍</span>
                Search Listings
            </div>
            <div class="feature">
                <span class="feature-icon">🤝</span>
                Reunite Owners
            </div>
        </div>

        <!-- Hidden nav from original -->
        <nav></nav>
    </div>

    <script>
    (function() {
        const btn = document.querySelector('.getStarted');
        if (!btn) return;

        btn.addEventListener('click', function() {
            // Micro interaction feedback
            btn.style.transform = 'scale(0.97)';
            setTimeout(() => {
                btn.style.transform = '';
            }, 120);

            
            window.location.href = 'dashboard.html'
        });

        // Accessibility
        btn.setAttribute('aria-label', 'Get started with FindMe lost and found system');
    })();
</script>
</body>
</html>
